<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tank Floor Inspector</title>
  <meta name="description" content="Offline tank floor inspection: MFL indications with UT and VT prove-up, plate map, API 653 MRT and reports.">
  <meta name="theme-color" content="#1d232b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="26" height="26">
      <span>Tank Floor Inspector</span>
    </div>
    <div class="job-title" id="jobTitle"></div>
    <div class="top-acts">
      <span class="file-state" id="fileState" hidden></span>
      <span class="save-state" id="saveState"></span>
      <button class="btn sm ghost-inv" id="installBtn" data-act="install" hidden>Install app</button>
      <button class="btn sm ghost-inv" id="saveFileBtn" data-act="file-save" hidden>Save file…</button>
      <details class="menu" id="exportMenu" hidden>
        <summary class="btn sm ghost-inv">Export ▾</summary>
        <div class="menu-pop">
          <button data-act="utl-down"><b>UT loader sheet (Excel) — for the UT technician</b></button>
          <button data-act="utl-up"><b>Upload completed UT loader sheet…</b></button>
          <hr>
          <button data-act="exp-ind">Indications (CSV / Excel)</button>
          <button data-act="exp-plates">Plate register (CSV / Excel)</button>
          <button data-act="exp-noz">Nozzle schedule (CSV / Excel)</button>
          <button data-act="exp-shell">Shell UT readings (CSV / Excel)</button>
          <button data-act="exp-roof">Roof UT readings (CSV / Excel)</button>
          <button data-act="exp-settle">Settlement survey (CSV / Excel)</button>
          <button data-act="exp-svg">Floor map (SVG)</button>
          <button data-act="exp-png">Floor map (PNG)</button>
          <button data-act="exp-shell-svg">Shell roll-out (SVG)</button>
          <hr>
          <button data-act="file-save-as">Save job file as… (JSON + photos)</button>
        </div>
      </details>
      <button class="btn sm primary" data-go="report">Report</button>
    </div>
  </header>
  <nav class="sidenav" id="nav"></nav>
  <main class="main" id="main"></main>

  <dialog id="dlg" class="dlg"><div id="dlgBody"></div></dialog>
  <dialog id="confirmDlg" class="dlg dlg-sm"></dialog>
  <div class="toast" id="toast" hidden role="status"></div>
    <input type="file" id="utlInput" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" data-act="utl-file" hidden>

  <noscript><p style="padding:2rem">This app needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
